# Web console + renewal scheduler.
#
#   docker compose up -d --build
#   docker compose logs -f
#   ./htacd doctor
#
# The container needs routed access to the gateways' management addresses and
# outbound HTTPS to the ACME CA and the Cloudflare API.

# Pinned rather than derived from the directory name. The datastore volume is
# named after the compose project, so renaming or moving this directory would
# otherwise silently point the service at a new, empty volume instead of
# failing visibly -- with every escrowed key still in the old one.
name: ht-autocert

services:
  htac:
    build:
      context: .
      dockerfile: Dockerfile.htac
      target: runtime
    # Local `docker compose up --build` tags this name. GitHub Actions CD sets
    # HTAC_IMAGE to the GHCR tag it just published so the VPS pulls that image.
    image: ${HTAC_IMAGE:-ht-autocert:latest}
    # Published on 8866 for autocert.managedcollab.com.
    #
    # Bound to loopback by default: the expectation is that a tunnel or reverse
    # proxy on this host terminates TLS and forwards to 127.0.0.1:8866. Set
    # HTAC_BIND=0.0.0.0 only if something off-box must reach it directly, and
    # only with TLS in front -- the console can issue and deploy across the
    # whole fleet.
    ports:
      - "${HTAC_BIND:-127.0.0.1}:${HTAC_HOST_PORT:-8866}:8000"
    volumes:
      # The datastore holds escrowed private keys. Back this volume up, and
      # treat the backup with the same care as the master key.
      - htac-data:/srv/data
    env_file:
      - path: .env.htac
        required: false
    environment:
      HTAC_DATABASE_URL: sqlite:////srv/data/htac.db
      # Structured logs for whatever collects them on the server.
      HTAC_LOG_JSON: "true"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    # Nothing here needs to escalate privileges.
    security_opt:
      - no-new-privileges:true

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.htac
      target: test
    image: ht-autocert:test
    entrypoint: []
    command: ["sh", "-c", "python -m pytest -q && python -m pyflakes app"]

volumes:
  htac-data:
